<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAR Internal Audit</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #667085; --line: #e4e7ec;
    --danger: #b42318; --danger-bg: #fef3f2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11151c; --card: #1a202a; --text: #e6e9ef; --muted: #98a2b3; --line: #2c3442;
      --danger: #fda29b; --danger-bg: #3a1a18;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .hidden { display: none !important; }

  /* sign-in (same look as the SAR IN Sea Export Pricing dashboard; the card stays white in dark mode) */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: linear-gradient(160deg, #1E3A8A, #0A1826 70%); }
  #login .card { width: 100%; max-width: 380px; background: #fff; border-radius: 20px; padding: 40px 44px;
                 text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.3); font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
  #login .login-logo { display: block; height: 52px; margin: 0 auto 18px; }
  #login .login-badge { display: inline-flex; align-items: center; gap: 6px; background: #E1F5EA; color: #1F8A4C;
                        font-size: 12.5px; font-weight: 700; padding: 6px 14px; border-radius: 999px; margin-bottom: 20px; }
  #login .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #1F8A4C; }
  #login h1 { margin: 0 0 10px; font-size: 21px; font-weight: 800; color: #1C2136; }
  #login p { margin: 0 0 22px; color: #4B536E; font-size: 13.5px; line-height: 1.5; }
  #gsiButton { display: flex; justify-content: center; min-height: 44px; }
  #loginMsg { margin: 14px 0 0; color: #C24A2E; font-size: 12.5px; }
  #login .login-divider { display: flex; align-items: center; gap: 12px; margin: 22px 0 16px; font-size: 10.5px;
                          font-weight: 700; letter-spacing: 0.6px; color: #9299B3; text-transform: uppercase; }
  #login .login-divider::before, #login .login-divider::after { content: ""; flex: 1; height: 1px; background: #E3E7F0; }
  #login .login-footer { font-size: 12.5px; color: #4B536E; line-height: 1.6; }
  #login .login-footer b { color: #1C2136; }
  @media (max-width: 420px) { #login .card { padding: 32px 22px; } }

  /* signed in */
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
           background: var(--card); border-bottom: 1px solid var(--line); }
  header .title { font-weight: 600; margin-right: auto; }
  header img { width: 28px; height: 28px; border-radius: 50%; }
  header .who { font-size: 13px; color: var(--muted); text-align: right; line-height: 1.3; }
  header button { border: 1px solid var(--line); background: transparent; color: var(--text);
                  border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  @media (max-width: 520px) { header .who { display: none; } }
</style>
</head>
<body>

<section id="login">
  <div class="card">
    <img class="login-logo" src="sar-logo.png" alt="SAR - Connecting Continents">
    <div class="login-badge"><span class="status-dot"></span>Live Dashboard</div>
    <h1>SAR Internal Audit</h1>
    <p>Sign in with your SAR Google Workspace account to access the SAR Internal Audit Dashboard.</p>
    <div id="gsiButton"></div>
    <div id="loginMsg" class="hidden"></div>
    <div class="login-divider">Restricted Access</div>
    <div class="login-footer">Access is restricted to authorised SAR team members.<br>Contact <b>Admin</b> to request access.</div>
  </div>
</section>

<section id="app" class="hidden">
  <header>
    <span class="title">SAR Internal Audit</span>
    <img id="meAvatar" alt="" class="hidden">
    <span class="who"><span id="meName"></span><br><span id="meRole"></span></span>
    <button id="signOut" type="button">Sign out</button>
  </header>
  <main>
    <p>Signed in. The audit pages will appear here.</p>
  </main>
</section>

<script>
const $ = (id) => document.getElementById(id);
let googleClientId = null;
// The sign-in token is kept in memory only, so a refresh signs the user out.
let idToken = null;
let me = null;

function tokenValid(t) {
  try {
    const p = JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    return p.exp * 1000 > Date.now() + 60000;
  } catch { return false; }
}
function getToken() { return idToken && tokenValid(idToken) ? idToken : null; }
function setToken(t) { idToken = t; }

function showLogin(message) {
  setToken(null);
  me = null;
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  if (!googleClientId) message = "Sign-in is not configured.";
  $("loginMsg").textContent = message || "";
  $("loginMsg").classList.toggle("hidden", !message);
  if (!googleClientId) return;
  const render = () => {
    google.accounts.id.initialize({ client_id: googleClientId, callback: onCredential, auto_select: false, ux_mode: "popup" });
    google.accounts.id.renderButton($("gsiButton"), { theme: "outline", size: "large", shape: "rectangular", text: "continue_with", width: 292 });
  };
  if (window.google?.accounts?.id) render();
  else window.addEventListener("load", render, { once: true });
}

function onCredential(resp) {
  setToken(resp.credential);
  start();
}

async function api(path, body) {
  const token = getToken();
  if (!token) { showLogin("Your sign-in expired. Please sign in again."); throw new Error("signed out"); }
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` }, body: JSON.stringify(body || {}) });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(data.error || "Please sign in again."); throw new Error("signed out"); }
  if (r.status === 403) { showLogin(data.error || "This Google account doesn't have access."); throw new Error("no access"); }
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

async function start() {
  try { me = await api("/api/me"); }
  catch (e) { if (!["signed out", "no access"].includes(e.message)) showLogin("Couldn't sign in: " + e.message); return; }
  $("meName").textContent = me.name;
  $("meRole").textContent = me.role === "admin" ? "Admin" : "Viewer";
  $("meAvatar").src = me.picture || "";
  $("meAvatar").classList.toggle("hidden", !me.picture);
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
}

$("signOut").onclick = () => { try { google.accounts.id.disableAutoSelect(); } catch {} showLogin(); };

(async () => {
  try { googleClientId = (await (await fetch("/api/config")).json()).googleClientId; } catch {}
  try { sessionStorage.removeItem("auditIdToken"); } catch {}   // drop a token saved by the earlier build
  showLogin();
})();
</script>
</body>
</html>
